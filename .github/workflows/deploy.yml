name: Deploy bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-employee-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      # Папка на сервере: <SERVER_DEPLOY_PATH>/<имя репозитория> или ~/<имя репозитория>.
      BOT_DIR: ${{ secrets.SERVER_DEPLOY_PATH && format('{0}/{1}', secrets.SERVER_DEPLOY_PATH, github.event.repository.name) || github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: npm run check

      - name: Build employees from employees.yml
        id: secrets
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install -q pyyaml
          ready=true
          for v in SERVER_HOST DOCKERHUB_USERNAME; do
            [ -n "${!v}" ] || { echo "::warning::Не задан секрет $v — деплой пропущен"; ready=false; }
          done
          if out=$(python3 scripts/employees.py employees.yml); then
            # Сначала маски (команды ::add-mask::), потом JSON — последней строкой.
            grep '^::add-mask::' <<<"$out" || true
            json=$(tail -n 1 <<<"$out")
            echo "BOT_EMPLOYEES=$json" >> "$GITHUB_ENV"
          else
            echo "::warning::Ни один сотрудник не настроен (employees.yml + секреты) — деплой пропущен"
            ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Set image metadata
        if: steps.secrets.outputs.ready == 'true'
        run: |
          echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          NAME="${{ github.event.repository.name }}"; echo "IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${NAME,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
        if: steps.secrets.outputs.ready == 'true'

      - uses: docker/login-action@v3
        if: steps.secrets.outputs.ready == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.secrets.outputs.ready == 'true'
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

      - name: Ensure deploy directory
        if: steps.secrets.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SSH_PORT || 22 }}
          script: mkdir -p "${{ env.BOT_DIR }}"

      - name: Copy compose to server
        if: steps.secrets.outputs.ready == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SSH_PORT || 22 }}
          source: docker-compose.yml
          target: ${{ env.BOT_DIR }}

      - name: Write .env and restart
        if: steps.secrets.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ env.TAG }}
          DEPLOY_PATH: ${{ env.BOT_DIR }}
          BOT_EMPLOYEES: ${{ env.BOT_EMPLOYEES }}
          STT_API_URL: ${{ env.STT_API_URL }}
          STT_API_KEY: ${{ env.STT_API_KEY }}
          STT_MODEL: ${{ env.STT_MODEL }}
          STT_LANGUAGE: ${{ env.STT_LANGUAGE }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SSH_PORT || 22 }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_TAG,DEPLOY_PATH,BOT_EMPLOYEES,STT_API_URL,STT_API_KEY,STT_MODEL,STT_LANGUAGE
          script: |
            set -euo pipefail
            cd "${DEPLOY_PATH}"
            umask 077
            {
              # Сотрудники из employees.yml + секретов — JSON одной строкой (compose не подставляет $ внутри кавычек).
              printf "BOT_EMPLOYEES='%s'\n" "$(printf '%s' "${BOT_EMPLOYEES:-}" | tr -d '\n\r')"
              # Расшифровка голосовых (необязательно).
              echo "STT_API_URL=${STT_API_URL:-}"
              echo "STT_API_KEY=${STT_API_KEY:-}"
              echo "STT_MODEL=${STT_MODEL:-}"
              echo "STT_LANGUAGE=${STT_LANGUAGE:-}"
            } > .env
            echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
            NAME="${{ github.event.repository.name }}"; export BOT_IMAGE="${DOCKERHUB_USERNAME}/${NAME,,}:${IMAGE_TAG}"
            # Ошибки прежнего контейнера (до перезапуска) — для разбора сбоев. Токены в лог не пишутся.
            echo "--- ошибки до перезапуска ---"
            docker compose logs --no-color --tail 300 2>/dev/null | grep -E "fire failed|остановлен|poll error|не запущен" | tail -n 15 || true
            echo "---"
            docker compose pull
            docker compose up -d --remove-orphans
            sleep 10
            docker compose ps
            test -n "$(docker compose ps --status running -q)"
            docker compose logs --tail 20
